<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold"><i class="bi bi-box-arrow-in-right text-primary"></i> Log in</h2>
            <h5 class="text-muted">Welcome back!</h5>
            <p class="text-muted small">Unlock your account by entering your credentials securely below.</p>
        </div>
        
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-body p-4 p-md-5">
                <form ng-submit="login()">
                    <div class="form-floating mb-3">
                        <input class="form-control" id="inputEmail" type="text" placeholder="Username or Email" ng-model="user.identifier" required />
                        <label for="inputEmail">Username or Email</label>
                    </div>
                    
                    <div class="form-floating mb-3 position-relative">
                        <input type="{{ showPassword ? 'text' : 'password' }}" class="form-control" id="inputPassword" placeholder="Password" ng-model="user.password" required />
                        <label for="inputPassword">Password</label>
                        <i class="bi" ng-class="showPassword ? 'bi-eye-slash' : 'bi-eye'" 
                           ng-click="togglePassword()" 
                           style="position: absolute; right: 15px; top: 18px; cursor: pointer; font-size: 1.2rem; color: #6c757d;">
                        </i>
                    </div>
                    
                    <div class="alert alert-danger" ng-if="errorMessage">
                        {{ errorMessage }}
                    </div>

                    <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                        <a class="small text-decoration-none" href="#!/forgot-password">Forgot Password ?</a>
                        <button type="submit" class="btn btn-primary px-4">Login</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3 bg-light">
                <div class="small"><a href="#!/signup" class="text-decoration-none">Need an account? Sign up!</a></div>
            </div>
        </div>
    </div>
</div>
