<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold"><i class="bi bi-key text-primary"></i> Reset Password</h2>
            <p class="text-muted small">Enter your Username or Email to reset your password directly.</p>
        </div>
        
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-body p-5">
                <form ng-submit="resetPassword()">
                    <div class="form-floating mb-3">
                        <input class="form-control" id="inputIdentifier" type="text" placeholder="Username or Email" ng-model="resetData.identifier" required />
                        <label for="inputIdentifier">Username or Email</label>
                    </div>
                    
                    <div class="form-floating mb-3 position-relative">
                        <input type="{{ showPassword ? 'text' : 'password' }}" class="form-control" id="inputNewPassword" placeholder="New Password" ng-model="resetData.newPassword" required />
                        <label for="inputNewPassword">New Password</label>
                        <i class="bi" ng-class="showPassword ? 'bi-eye-slash' : 'bi-eye'" 
                           ng-click="togglePassword()" 
                           style="position: absolute; right: 15px; top: 18px; cursor: pointer; font-size: 1.2rem; color: #6c757d;">
                        </i>
                    </div>
                    
                    <div class="alert" ng-class="{'alert-danger': isError, 'alert-success': isSuccess}" ng-if="message">
                        {{ message }}
                    </div>

                    <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                        <a class="small text-decoration-none" href="#!/login"><i class="bi bi-arrow-left"></i> Back to Login</a>
                        <button type="submit" class="btn btn-primary px-4">Reset Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
